name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No Gradle wrapper jar in the repo: CI installs this exact Gradle version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Signing key
        env:
          FOOD_KEYSTORE_B64: ${{ secrets.FOOD_KEYSTORE_B64 }}
        run: |
          if [ -n "$FOOD_KEYSTORE_B64" ]; then
            echo "$FOOD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/food.p12"
            echo "FOOD_KEYSTORE=$RUNNER_TEMP/food.p12" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Release keystore found: building a signed release APK."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No FOOD_KEYSTORE_B64 secret: building a debug APK (cannot be updated in place)."
          fi

      - name: Build APK
        working-directory: android
        env:
          FOOD_KEYSTORE_PASSWORD: ${{ secrets.FOOD_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          task=assembleDebug
          [ "$SIGNED" = "true" ] && task=assembleRelease
          gradle --no-daemon --stacktrace "$task" 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Turn compiler / Gradle errors into an annotation so they are readable without opening the logs.
      - name: Summarise build errors
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/build.log" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          keep, grab = [], 0
          for ln in lines:
              if re.match(r"^(e: |w: .*error|ERROR|FAILURE|\* What went wrong|> |Could not|.*error:)", ln) or grab:
                  keep.append(ln[:400])
                  grab = 6 if ln.startswith("* What went wrong") else max(grab - 1, 0)
          msg = "\n".join(keep[:80]) or "\n".join(lines[-60:])
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=Build failed::{msg}")
          PY

      - name: Name the APK
        id: apk
        run: |
          if [ "$SIGNED" = "true" ]; then src=$(ls android/app/build/outputs/apk/release/*.apk | head -1); else src=$(ls android/app/build/outputs/apk/debug/*.apk | head -1); fi
          name="spiz-1.0.${{ github.run_number }}$([ "$SIGNED" = "true" ] || echo -debug).apk"
          cp "$src" "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: env.SIGNED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Spíž 1.0.${{ github.run_number }}
          body: "Built from ${{ github.sha }} by GitHub Actions. Install or update with Obtainium, or download the APK below."
          files: ${{ steps.apk.outputs.file }}
